# Local WordPress for the portfolio demo. Site: http://localhost:8088  Admin: /wp-admin (creds in .env)
services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:php8.4-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro   # site guide on the dashboard
  # one-off admin commands: docker compose run --rm wpcli wp <cmd>
  wpcli:
    image: wordpress:cli-php8.4
    profiles: [cli]
    user: "33:33"
    depends_on: [db]
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp:/var/www/html
volumes:
  db:
  wp:
